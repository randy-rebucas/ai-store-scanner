<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C6AC4"/>
      <stop offset="100%" stop-color="#202E78"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE070"/>
      <stop offset="100%" stop-color="#FFB238"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EAF0FF" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" rx="264" fill="url(#bg)"/>

  <!-- storefront -->
  <g transform="translate(300,430)">
    <rect x="0" y="90" width="430" height="260" rx="18" fill="#FFFFFF" fill-opacity="0.14"/>
    <path d="M -20 90 L 215 -60 L 450 90 Z" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="40" y="150" width="90" height="200" rx="10" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="170" y="150" width="90" height="120" rx="10" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="300" y="150" width="90" height="200" rx="10" fill="#FFFFFF" fill-opacity="0.28"/>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(560,300)">
    <circle cx="230" cy="230" r="210" fill="url(#glass)"/>
    <circle cx="230" cy="230" r="210" fill="none" stroke="#202E78" stroke-width="34"/>
    <rect x="430" y="430" width="290" height="66" rx="33" transform="rotate(45 430 430)" fill="#202E78"/>
  </g>

  <!-- AI spark inside the lens -->
  <g transform="translate(700,440)">
    <path d="M0 -95 L26 -26 L95 0 L26 26 L0 95 L-26 26 L-95 0 L-26 -26 Z" fill="url(#spark)"/>
  </g>
</svg>
