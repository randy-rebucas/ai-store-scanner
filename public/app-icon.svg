<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D7BE0"/>
      <stop offset="100%" stop-color="#1A2166"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE070"/>
      <stop offset="100%" stop-color="#FFAA22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" rx="264" fill="url(#bg)"/>

  <!-- magnifying glass, bold and centered -->
  <g transform="translate(240,240)">
    <circle cx="330" cy="330" r="290" fill="#FFFFFF"/>
    <circle cx="330" cy="330" r="290" fill="none" stroke="#FFFFFF" stroke-width="0"/>
    <circle cx="330" cy="330" r="308" fill="none" stroke="#101340" stroke-width="46"/>
    <rect x="560" y="560" width="330" height="80" rx="40" transform="rotate(45 560 560)" fill="#101340"/>
  </g>

  <!-- AI spark, large and centered in the lens -->
  <g transform="translate(570,570)">
    <path d="M0 -150 L38 -38 L150 0 L38 38 L0 150 L-38 38 L-150 0 L-38 -38 Z" fill="url(#spark)"/>
  </g>
</svg>
